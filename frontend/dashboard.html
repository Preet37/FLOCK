<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flock Console</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2034%2034%22%3E%3Cpath%20d%3D%22M17%200L20.8%2013.2L34%2017L20.8%2020.8L17%2034L13.2%2020.8L0%2017L13.2%2013.2L17%200Z%22%20fill%3D%22%23C4FE29%22%2F%3E%3Cpath%20d%3D%22M17%206L19.5%2014.5L28%2017L19.5%2019.5L17%2028L14.5%2019.5L6%2017L14.5%2014.5L17%206Z%22%20fill%3D%22%236B57EC%22%2F%3E%3C%2Fsvg%3E">
    <!-- Tailwind (play build) and Lucide icons are vendored so the console works with no network (stage Wi-Fi) -->
    <script src="vendor/tailwind-3.4.16.js"></script>
    <!-- Google Fonts: Plus Jakarta Sans (falls back to the system sans offline) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="vendor/lucide-0.453.0.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        sidebar: '#161618',
                        cardDark: '#18181A',
                        limeAccent: '#C4FE29',
                        limeAccentHover: '#B2EB1B',
                        purpleAccent: '#6B57EC',
                        purpleAccentHover: '#5945E0',
                        bgMain: '#EBECEE',
                        lightCardBg: '#F5F6F8',
                    },
                    borderRadius: {
                        '2xl': '18px',
                        '3xl': '24px',
                        '4xl': '30px',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
            background-color: #EBECEE;
            color: #111111;
            -webkit-tap-highlight-color: transparent;
        }

        /* Custom slim scrollbar for internal lists only */
        .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.15); border-radius: 9999px; }
        .dark-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
        .dark-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 9999px; }

        /* Hide horizontal scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Pattern for diagonal striped bars */
        .striped-bar {
            background: repeating-linear-gradient(-45deg, #E2E4E8, #E2E4E8 5px, #F0F1F5 5px, #F0F1F5 10px);
        }

        /* Soft Card Shadows */
        .card-shadow { box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.03); }

        .pulse-dot { animation: pulse 1.6s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
        .flash { animation: flash 1.4s ease-out; }
        @keyframes flash { from { background-color: rgba(196, 254, 41, .25); } to { background-color: transparent; } }
        .slide-in { animation: slide .18s ease-out; }
        @keyframes slide { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
        .tabular-nums { font-variant-numeric: tabular-nums; }

        /* waterfall (lump sum) */
        .wf text { font-family: inherit; }
        .wf .lbl { font-size: 13px; font-weight: 600; fill: #6B7280; }
        .wf .val { font-size: 13px; font-weight: 800; fill: #111; }
        .wf .gap { font-size: 14px; font-weight: 800; fill: #DC2626; }
    </style>
</head>

<body class="h-full w-full overflow-x-hidden lg:overflow-hidden bg-bgMain flex flex-col lg:flex-row antialiased">

    <!-- ================= DESKTOP SIDEBAR ================= -->
    <aside class="hidden lg:flex w-20 xl:w-24 bg-sidebar flex-col items-center justify-between py-6 z-30 shrink-0 h-full">
        <a href="#/" class="cursor-pointer hover:scale-105 transition-transform" aria-label="Flock home">
            <div class="w-10 h-10 relative flex items-center justify-center">
                <svg width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17 0L20.8 13.2L34 17L20.8 20.8L17 34L13.2 20.8L0 17L13.2 13.2L17 0Z" fill="#C4FE29" />
                    <path d="M17 6L19.5 14.5L28 17L19.5 19.5L17 28L14.5 19.5L6 17L14.5 14.5L17 6Z" fill="#6B57EC" fill-opacity="0.85" />
                </svg>
            </div>
        </a>

        <nav class="flex flex-col items-center gap-5" id="sideNav">
            <a href="#/" data-nav="overview" title="Overview" aria-label="Overview" class="nav-btn w-11 h-11 rounded-2xl flex items-center justify-center text-gray-400 hover:text-white transition hover:bg-gray-800">
                <i data-lucide="house" class="w-5 h-5 stroke-[2]"></i>
            </a>
            <a href="#/lumpsums" data-nav="lumpsums" title="Lump sums" aria-label="Lump sums" class="nav-btn w-11 h-11 rounded-2xl flex items-center justify-center text-gray-400 hover:text-white transition hover:bg-gray-800">
                <i data-lucide="landmark" class="w-5 h-5 stroke-[2]"></i>
            </a>
            <a href="#/theater" data-nav="theater" title="Agent theater" aria-label="Agent theater" class="nav-btn w-11 h-11 rounded-2xl flex items-center justify-center text-gray-400 hover:text-white transition hover:bg-gray-800">
                <i data-lucide="clapperboard" class="w-5 h-5 stroke-[2]"></i>
            </a>
            <a href="#/sources" data-nav="sources" title="Sources / Inbox" aria-label="Sources" class="nav-btn w-11 h-11 rounded-2xl flex items-center justify-center text-gray-400 hover:text-white transition hover:bg-gray-800">
                <i data-lucide="inbox" class="w-5 h-5 stroke-[2]"></i>
            </a>
            <a href="#/scoreboard" data-nav="scoreboard" title="Scoreboard + judge market" aria-label="Scoreboard" class="nav-btn w-11 h-11 rounded-2xl flex items-center justify-center text-gray-400 hover:text-white transition hover:bg-gray-800">
                <i data-lucide="trophy" class="w-5 h-5 stroke-[2]"></i>
            </a>
        </nav>

        <div>
            <button data-open-settings title="Settings" class="w-11 h-11 rounded-2xl flex items-center justify-center text-gray-400 hover:text-white transition hover:bg-gray-800" aria-label="Settings">
                <i data-lucide="settings" class="w-5 h-5 stroke-[2]"></i>
            </button>
        </div>
    </aside>

    <!-- ================= MOBILE BOTTOM FLOATING NAVBAR ================= -->
    <nav class="lg:hidden fixed bottom-0 inset-x-0 bg-sidebar/95 backdrop-blur-md border-t border-gray-800/60 flex items-center justify-around py-3 px-4 z-40 text-gray-400">
        <a href="#/" data-nav="overview" class="nav-btn p-2 hover:text-white rounded-xl" aria-label="Overview"><i data-lucide="house" class="w-6 h-6"></i></a>
        <a href="#/lumpsums" data-nav="lumpsums" class="nav-btn p-2 hover:text-white rounded-xl" aria-label="Lump sums"><i data-lucide="landmark" class="w-6 h-6"></i></a>
        <a href="#/theater" data-nav="theater" class="nav-btn p-2 hover:text-white rounded-xl" aria-label="Agent theater"><i data-lucide="clapperboard" class="w-6 h-6"></i></a>
        <a href="#/sources" data-nav="sources" class="nav-btn p-2 hover:text-white rounded-xl" aria-label="Sources"><i data-lucide="inbox" class="w-6 h-6"></i></a>
        <a href="#/scoreboard" data-nav="scoreboard" class="nav-btn p-2 hover:text-white rounded-xl" aria-label="Scoreboard"><i data-lucide="trophy" class="w-6 h-6"></i></a>
        <button data-open-settings class="p-2 hover:text-white" aria-label="Settings"><i data-lucide="settings" class="w-6 h-6"></i></button>
    </nav>

    <!-- ================= MAIN CONTAINER ================= -->
    <main class="flex-1 flex flex-col h-full min-h-0 min-w-0 p-4 sm:p-5 lg:p-6 gap-4 lg:gap-5 pb-24 lg:pb-6 lg:overflow-y-auto custom-scroll">

        <!-- TOP HEADER -->
        <header class="flex items-center justify-between shrink-0 min-h-11 gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <div class="lg:hidden w-8 h-8 relative flex items-center justify-center shrink-0">
                    <svg width="28" height="28" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17 0L20.8 13.2L34 17L20.8 20.8L17 34L13.2 20.8L0 17L13.2 13.2L17 0Z" fill="#C4FE29" />
                        <path d="M17 6L19.5 14.5L28 17L19.5 19.5L17 28L14.5 19.5L6 17L14.5 14.5L17 6Z" fill="#6B57EC" fill-opacity="0.85" />
                    </svg>
                </div>
                <div class="min-w-0">
                    <h1 id="pageTitle" class="text-xl sm:text-2xl lg:text-3xl font-extrabold tracking-tight text-gray-900 leading-none truncate">Flock</h1>
                    <p id="pageSub" class="text-gray-500 font-semibold text-xs sm:text-sm mt-1 truncate">Simulated data</p>
                </div>
            </div>

            <div class="flex items-center gap-2.5 sm:gap-3 shrink-0">
                <div id="liveStatus" class="hidden sm:flex items-center gap-2 bg-white rounded-full px-3 h-9 sm:h-10 text-xs font-bold text-gray-600 border border-gray-200/50 shadow-sm">
                    <span class="w-2 h-2 rounded-full bg-gray-300"></span> Connecting
                </div>
                <a href="#/?filter=review" id="queueBell" class="relative w-9 h-9 sm:w-10 sm:h-10 bg-white rounded-full flex items-center justify-center text-gray-700 shadow-sm hover:bg-gray-50 transition border border-gray-200/50" aria-label="Waiting for a human" title="Waiting for a human">
                    <i data-lucide="bell" class="w-4 h-4"></i>
                    <span id="queueCount" class="hidden absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-purpleAccent text-white text-[10px] font-extrabold flex items-center justify-center"></span>
                </a>
                <button data-open-settings id="actorBadge" class="w-9 h-9 sm:w-10 sm:h-10 rounded-full border-2 border-white shadow-sm shrink-0 hover:ring-2 hover:ring-purpleAccent/50 transition bg-cardDark text-limeAccent text-xs font-extrabold flex items-center justify-center" aria-label="Reviewer settings" title="Reviewer settings">
                    <i data-lucide="key-round" class="w-4 h-4"></i>
                </button>
            </div>
        </header>

        <!-- Showtime banner (GET /api/showtime) -->
        <div id="showtimeBanner" class="hidden shrink-0"></div>

        <!-- The current view (hash route) renders here -->
        <div id="view" class="shrink-0 min-w-0 flex flex-col gap-4 lg:gap-5"></div>

        <p class="text-[11px] text-gray-400 font-medium shrink-0">All data is simulated. Agents propose, people approve, only the gatekeeper files. <span id="apiBase"></span></p>
    </main>

    <!-- ================= FINDING / AGENT DRAWER ================= -->
    <div id="drawer" class="fixed inset-0 z-50 hidden">
        <div data-close-drawer class="absolute inset-0 bg-black/40 backdrop-blur-[2px]"></div>
        <aside class="slide-in absolute right-0 top-0 h-full w-full sm:w-[640px] lg:w-[720px] bg-bgMain shadow-2xl flex flex-col">
            <div class="flex items-center justify-between gap-3 px-4 sm:px-6 py-4 bg-white border-b border-gray-100">
                <h3 id="drawerTitle" class="text-lg font-extrabold text-gray-900 truncate"></h3>
                <button data-close-drawer class="w-9 h-9 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center shrink-0" aria-label="Close">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            <div id="drawerBody" class="flex-1 overflow-y-auto custom-scroll p-4 sm:p-6 space-y-4"></div>
        </aside>
    </div>

    <!-- ================= ACTION MODAL DIALOG (how we got this, etc.) ================= -->
    <div id="actionModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-[60] opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="bg-white rounded-3xl p-6 w-full max-w-lg card-shadow transform scale-95 transition-transform duration-200 max-h-[85vh] flex flex-col" id="modalContainer">
            <div class="flex items-center justify-between mb-4 shrink-0">
                <h3 id="modalTitle" class="text-lg font-bold text-gray-900">How we got this</h3>
                <button data-close-modal class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 hover:text-black" aria-label="Close">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            <div id="modalBody" class="text-sm text-gray-600 overflow-y-auto custom-scroll pr-1"></div>
        </div>
    </div>

    <!-- ================= SETTINGS ================= -->
    <div id="settingsModal" class="fixed inset-0 z-[70] hidden items-center justify-center bg-black/40 backdrop-blur-[2px] p-4">
        <form id="settingsForm" class="bg-white rounded-3xl p-6 w-full max-w-md shadow-2xl">
            <h3 class="text-lg font-bold text-gray-900 mb-1">Reviewer settings</h3>
            <p class="text-xs text-gray-500 mb-4">Kept in this browser only (localStorage). Approve / Reject send <code>Authorization: Bearer &lt;token&gt;</code> and your name as the actor in the audit log.</p>
            <label class="block text-xs font-bold text-gray-700 mb-1" for="actorInput">Your name (actor)</label>
            <input id="actorInput" autocomplete="off" class="w-full px-4 py-2.5 rounded-2xl border border-gray-200 text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-purpleAccent" placeholder="e.g. maja">
            <label class="block text-xs font-bold text-gray-700 mb-1" for="tokenInput">API token</label>
            <input id="tokenInput" type="password" autocomplete="off" class="w-full px-4 py-2.5 rounded-2xl border border-gray-200 text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-purpleAccent" placeholder="FLOCK_API_TOKEN">
            <label class="block text-xs font-bold text-gray-700 mb-1" for="apiInput">API base URL</label>
            <input id="apiInput" autocomplete="off" class="w-full px-4 py-2.5 rounded-2xl border border-gray-200 text-sm mb-1 focus:outline-none focus:ring-2 focus:ring-purpleAccent" placeholder="leave empty for automatic">
            <p id="apiHint" class="text-[11px] text-gray-400 mb-4"></p>
            <div class="flex justify-end gap-2">
                <button type="button" data-close-settings class="px-4 py-2.5 rounded-2xl text-sm font-bold text-gray-600 hover:bg-gray-100">Cancel</button>
                <button type="submit" class="px-5 py-2.5 rounded-2xl text-sm font-bold bg-purpleAccent hover:bg-purpleAccentHover text-white">Save</button>
            </div>
        </form>
    </div>

    <div id="toast" role="status" class="fixed bottom-24 lg:bottom-6 left-1/2 -translate-x-1/2 z-[80] hidden rounded-2xl bg-cardDark text-white text-sm font-semibold px-4 py-3 shadow-xl max-w-[90vw]"></div>

    <script src="dashboard.js"></script>
</body>

</html>
